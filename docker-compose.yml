# docker-compose.yml — one command to run the ARENA test environment.
#
#   docker compose up --build        build + start server, client, settlement
#   docker compose up -d             (after the first build) start detached
#   docker compose logs -f server    follow one service
#   docker compose down              stop everything (debts survive in volume)
#   docker compose --profile full up build+start ALSO postgres (lottery/indexer)
#
# All config comes from .env (copy .env.example -> .env and fill it in).
# The SAME command works on your Mac (PUBLIC_HOST=localhost) and on a VPS
# (PUBLIC_HOST=<vps-ip>) — only .env changes.
#
# WHY a shared SETTLEMENT_SECRET is REQUIRED here: server and settlement
# are separate containers, so their traffic is NOT loopback. The server
# closes /settlement/* to non-loopback callers unless a secret is set —
# so both sides must carry the same one, or payouts never settle.

services:
  # --- the authoritative game server (Colyseus + chain truth) ---------
  server:
    build:
      context: ./arena
      dockerfile: server/Dockerfile
    container_name: arena_server
    restart: unless-stopped
    environment:
      ROUND_ID: ${ROUND_ID}                       # required for the PAID arena
      RPC_URL: ${RPC_URL}
      # SIWS binds to the domain the browser is served from (the client
      # signs with window.location.host). Set AUTH_DOMAIN to exactly that:
      # http local -> localhost:8080 ; VPS https -> <host>.sslip.io
      AUTH_DOMAIN: ${AUTH_DOMAIN}
      SETTLEMENT_SECRET: ${SETTLEMENT_SECRET}
      DEMO_BOTS: ${DEMO_BOTS:-}
      # AF.1 — round rotation. Unset = production defaults (24h round,
      # 30min rotation margin, 30min drain grace). ROUND_AUTOROTATE=0
      # pins the server to ROUND_ID and restores the manual behaviour.
      ROUND_DURATION_S: ${ROUND_DURATION_S:-}
      ROTATION_MARGIN_S: ${ROTATION_MARGIN_S:-}
      DRAIN_GRACE_S: ${DRAIN_GRACE_S:-}
      ROUND_AUTOROTATE: ${ROUND_AUTOROTATE:-}
    ports:
      - "${SERVER_PORT}:2567"
    volumes:
      - arena_data:/data                          # durable debts + anti-replay log
    # Docker's default json-file driver NEVER rotates: with real players
    # the server's stdout would grow until the VPS disk fills. Bounded
    # here — what must survive (debts, deposits, round ops, death
    # forensics) is written to /data, not to stdout.
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }
    healthcheck:
      # /auth/challenge, NOT /round: liveness must mean "the server is
      # up", never "a paid round exists". /round answers 503 in free-only
      # mode, which used to show the container as unhealthy (cosmetic) —
      # and with AF.1 it would DEADLOCK: no round -> unhealthy -> the
      # settlement service never starts -> nobody signs the round the
      # server just asked to open.
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:2567/auth/challenge"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # --- the web client (static build, baked to PUBLIC_HOST) ------------
  client:
    build:
      context: ./arena
      dockerfile: client/Dockerfile
      args:
        # Baked in at build time — the browser reaches the game server
        # here. http local -> http://localhost:2567 ; VPS https (Caddy
        # path-routes on ONE origin) -> https://<host>.sslip.io
        VITE_SERVER_URL: ${VITE_SERVER_URL}
    container_name: arena_client
    restart: unless-stopped
    ports:
      - "${CLIENT_PORT}:80"

  # --- settlement: pays extractions & refunds to wallets -------------
  settlement:
    build:
      context: .
      dockerfile: settlement/Dockerfile
    container_name: arena_settlement
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    environment:
      GAME_SERVER_URL: http://server:2567         # internal docker network
      RPC_URL: ${RPC_URL}
      SETTLEMENT_SECRET: ${SETTLEMENT_SECRET}
      POLL_INTERVAL_S: ${POLL_INTERVAL_S:-5}
      # AF.1 — settings for the rounds this service now OPENS itself.
      # Unset treasury = the authority wallet (devnet convention).
      TREASURY_PUBKEY: ${TREASURY_PUBKEY:-}
      RAKE_BPS: ${RAKE_BPS:-550}
    volumes:
      # The authority keypair signs real payouts. Mounted read-only from
      # the host; the container reads it at AUTHORITY_KEYPAIR=/keys/...
      - ${AUTHORITY_KEYPAIR_HOST}:/keys/authority.json:ro

  # --- OPTIONAL: HTTPS reverse-proxy (profile "https") ----------------
  # Fronts client + server on ONE hostname with an automatic Let's
  # Encrypt cert. REQUIRED for a public deployment: Phantom refuses to
  # sign on a non-secure context (http on a bare IP). Use an sslip.io
  # SITE_HOST so no domain purchase is needed. Needs ports 80 + 443 open.
  caddy:
    image: caddy:2-alpine
    container_name: arena_caddy
    profiles: ["https"]
    restart: unless-stopped
    depends_on:
      - client
      - server
    environment:
      SITE_HOST: ${SITE_HOST}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data       # certificates persist across restarts
      - caddy_config:/config

  # --- OPTIONAL: postgres for the indexer/history (profile "full") ----
  postgres:
    image: postgres:16
    container_name: lottery_postgres
    profiles: ["full"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - lottery_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  arena_data:
  lottery_pgdata:
  caddy_data:
  caddy_config:
