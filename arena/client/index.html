<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Nimbo Arena</title>
        <style>
            html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1020; }
            /* HUD overlays sit ON TOP of the Pixi canvas (DOM, not
               stage text: free layout, no per-frame redraw cost) */
            #overlay {
                position: fixed; top: 8px; left: 8px; z-index: 10;
                color: #e2e8f0; font: 13px monospace;
                pointer-events: none; /* clicks fall through to the game */
            }
            #net { color: #6a9bf5; }
            /* join feed: top-right, newest first, entries fade out via
               the .old class (JS adds it before removal) */
            #feed {
                position: fixed; top: 8px; right: 8px; z-index: 10;
                color: #ffcc66; font: 13px monospace; text-align: right;
                pointer-events: none;
            }
            #feed div { transition: opacity 1s; }
            #feed div.old { opacity: 0; }
        </style>
    </head>
    <body>
        <div id="overlay">
            <div id="status">connecting...</div>
            <div id="net"></div>
        </div>
        <div id="feed"></div>
        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
