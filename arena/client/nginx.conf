# Cache policy for the arena web client.
#
# WHY THIS FILE EXISTS. With nginx's stock config a deploy could land on
# the VPS, be served correctly, and still show players the previous build
# — which is exactly what happened on 2026-09-08. Vite fingerprints every
# bundle (`index-BXYbEpyc.js`), so an asset can never go stale: its name
# changes the moment its content does. But the ENTRY POINT is not
# fingerprinted, and it is what names the bundles. Cached by the browser,
# index.html keeps asking for yesterday's file names, and the new build is
# invisible no matter how correct the server is.
#
# Two rules, opposite on purpose:
#   - fingerprinted assets: cache forever, they are immutable by design;
#   - index.html: revalidate every time, it is the only mutable name.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Content-addressed names — a changed file is a changed URL, so there
    # is nothing to invalidate and no reason to ever re-fetch.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # `no-cache` does NOT mean "do not store": it means "revalidate before
    # use". The browser keeps the file and asks with an ETag, so an
    # unchanged deploy still costs a 304 and no download.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
